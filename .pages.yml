media:
  input: media
  output: /media

content:
  - name: menu-items
    label: Menu items
    type: file
    path: data/menu-items.json
    format: json
    list: true
    fields:
      - name: name
        label: Dish name
        type: string
        required: true
      - name: price
        label: Price in pounds (numbers only)
        type: string
        required: true
      - name: description
        label: Short description or portion size
        type: text
      - name: category
        label: Menu category
        type: select
        options:
          values:
            - name: Starters & Sides ✦
              label: Starters & Sides
            - name: Biriyani ✦
              label: Biriyani
            - name: Rice & Breads 🌸
              label: Rice & Breads
            - name: Non-Veg Curries ✦
              label: Non-Veg Curries
            - name: Veg Curries ✦
              label: Veg Curries
            - name: Sweets & Snacks 🌸
              label: Sweets & Snacks
            - name: Drinks 🥭
              label: Drinks
      - name: available
        label: Show on the menu
        type: boolean
        default: true
    view:
      fields: [name, category, price, available]
      primary: name

  - name: gallery
    label: Food gallery
    type: file
    path: data/gallery.json
    format: json
    list: true
    fields:
      - name: image
        label: Photo
        type: image
        required: true
      - name: image_alt
        label: Photo description
        type: string
      - name: title
        label: Photo heading
        type: string
      - name: description
        label: Caption
        type: text
    view:
      fields: [title, image]
      primary: title

  - name: special-menus
    label: Special menus
    type: file
    path: data/special-menus.json
    format: json
    list: true
    fields:
      - name: title
        label: Heading
        type: string
        required: true
      - name: subtitle
        label: Short subtitle
        type: string
      - name: message
        label: Description
        type: text
      - name: image
        label: Image file path
        type: image
      - name: image_alt
        label: Image description
        type: string
      - name: button_label
        label: Button text
        type: string
      - name: button_url
        label: Button link
        type: string
      - name: published
        label: Show this menu on the website
        type: boolean
        default: true
      - name: layout
        label: Layout
        type: select
        options:
          values:
            - name: centered
              label: Centred
            - name: grid
              label: Grid
            - name: left
              label: Left aligned
            - name: carousel
              label: Horizontal carousel
      - name: theme
        label: Festival theme
        type: select
        options:
          values:
            - name: diwali
              label: Diwali
            - name: pongal
              label: Pongal
            - name: holi
              label: Holi
            - name: navratri
              label: Navratri
            - name: general
              label: General celebration
      - name: animation
        label: Decoration
        type: select
        options:
          values:
            - name: fireworks
              label: Fireworks
            - name: sparkles
              label: Sparkles
            - name: none
              label: None
    view:
      fields: [title, published, theme]
      primary: title

settings:
  content:
    merge: true
